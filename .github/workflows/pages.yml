name: Interfacer documentation · GitHub Pages

on:
  # Deliberately manual: approve disclosure before publication.
  # Deliberatamente manuale: approvare la disclosure prima della pubblicazione.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interfacer-architecture-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python scripts/validate_docs.py
      - run: mkdocs build --strict
      - run: python scripts/validate_docs.py --site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages · Pubblica su Pages
        id: deployment
        uses: actions/deploy-pages@v4
